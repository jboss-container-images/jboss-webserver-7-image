schema_version: 1

name: "jboss-webserver-7/webserver70-openjdk17-tomcat11-rhel9"
description: "Red Hat JBoss Web Server 7.0 Tomcat 11 container image"
version: "7.0.1"
from: "registry.access.redhat.com/ubi9/ubi-minimal"
labels:
    - name: "com.redhat.component"
      value: "jboss-webserver-7-webserver70-openjdk17-tomcat11-rhel9-container"
    - name: "org.jboss.product"
      value: "webserver-tomcat11"
    - name: "org.jboss.product.version"
      value: "7.0.1"
    - name: "org.jboss.product.webserver-tomcat11.version"
      value: "7.0.1"
    - name: "org.jboss.deployments-dir"
      value: "/opt/jws-7.0/tomcat/webapps"
    - name: "com.redhat.deployments-dir"
      value: "/opt/jws-7.0/tomcat/webapps"
    - name: "com.redhat.deployments-dir"
      value: "/opt/jws-7.0/tomcat/webapps"
    - name: "com.redhat.dev-mode"
      value: "DEBUG:true"
      description: "Environment variable used to enable development mode (debugging).  A value of true will enable development mode."
    - name: "com.redhat.dev-mode.port"
      value: "JPDA_ADDRESS:8000"
      description: "Environment variable used to specify the debug port.  If not set, the default Tomcat debug port will be used (8000).  Only applicable when development mode is enabled."
envs:
    - name: "JBOSS_PRODUCT"
      value: "webserver"
    - name: "JBOSS_WEBSERVER_VERSION"
      value: "7.0.1"
    - name: "PRODUCT_VERSION"
      value: "7.0.1"
    - name: "TOMCAT_VERSION"
      value: "11.0.21"
    - name: "JWS_HOME"
      value: "/opt/jws-7.0/tomcat"
    - name: "CATALINA_OPTS"
      value: "-Djava.security.egd=file:/dev/./urandom"
    - name: "JPDA_ADDRESS"
      value: "8000"
      description: "Specify the port to use for debugging. If not set, the default Tomcat debug port will be used (8000).  Only applicable when development mode is enabled."
    - name: DEBUG
      example: false
      description: "Specify true to enable development mode (debugging)."
ports:
    - value: 8080
    - value: 8000
      expose: false
modules:
      repositories:
          - name: openjdk
            git:
                url: https://github.com/rh-openjdk/redhat-openjdk-containers
                ref: ubi9
          - name: wildfly-cekit-modules
            git:
                url: https://github.com/wildfly/wildfly-cekit-modules
                ref: 0.33.0
          - path: modules
      install:
          - name: jboss.container.util.pkg-update
            version: "1.0"
          - name: jboss.container.user
            version: "2.0+jboss1"
          - name: jboss.container.openjdk.jdk
            version: "17"
          - name: jws-unpack-tomcat11
            version: "1.0"
          - name: insights-agent
            version: "1.1"
          - name: jws-chown
            version: "1.1"
          - name: jws-debugging
            version: "1.1"
          - name: jws-disable-ajp
            version: "1.1"
packages:
      manager: microdnf
      content_sets_file: content_sets_rhel9.yml
      install:
          - apr-util

run:
      user: 185
      cmd:
          - "/opt/jws-7.0/tomcat/bin/catalina.sh"
          - "run"
osbs:
    repository:
        name: containers/jboss-webserver-openjdk17-tomcat11
        branch: jws-7.0-dev-rhel-9
    configuration:
        container:
            compose:
                pulp_repos: true
            platforms:
                only:
                    - x86_64
                    - s390x
                    - ppc64le
                    - aarch64  

